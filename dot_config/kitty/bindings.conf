
clear_all_mouse_actions yes
clear_all_shortcuts yes

mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left press grabbed discard_event
mouse_map middle release ungrabbed paste_from_selection
mouse_map left press ungrabbed mouse_selection drag_or_normal_select
mouse_map ctrl+left press grabbed,ungrabbed mouse_selection normal
mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin
mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point
mouse_map right press ungrabbed mouse_selection extend
mouse_map shift+left press ungrabbed mouse_selection extend
mouse_map shift+middle release ungrabbed,grabbed paste_selection
mouse_map shift+middle press grabbed discard_event
mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle
mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word
mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line
mouse_map shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_begin
mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point
mouse_map shift+right press ungrabbed,grabbed mouse_selection extend
mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

kitty_mod ctrl+shift
map_timeout 1.0

action_alias launch_tab launch --type=tab --cwd=current

map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard
map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard
map --allow-fallback=shifted,ascii kitty_mod+alt+v paste_from_selection

map kitty_mod+up scroll_line_up smooth
map --allow-fallback=shifted,ascii kitty_mod+k scroll_line_up smooth
map kitty_mod+down scroll_line_down smooth
map --allow-fallback=shifted,ascii kitty_mod+j scroll_line_down smooth

map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down

map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map --allow-fallback=shifted,ascii kitty_mod+g scroll_end

map --allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1
map --allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1

map --allow-fallback=shifted,ascii kitty_mod+h show_scrollback
map --allow-fallback=shifted,ascii kitty_mod+o show_last_command_output
map --allow-fallback=shifted,ascii kitty_mod+alt+o show_last_visited_command_output
map kitty_mod+/                    search_scrollback

map --allow-fallback=shifted,ascii ctrl+j neighboring_window down
map --allow-fallback=shifted,ascii ctrl+k neighboring_window up
map --allow-fallback=shifted,ascii ctrl+h neighboring_window left
map --allow-fallback=shifted,ascii ctrl+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM ctrl+j
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM ctrl+k
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM ctrl+h
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM ctrl+l

# the 3 here is the resize amount, adjust as needed
map --allow-fallback=shifted,ascii alt+j kitten relative_resize.py down  3
map --allow-fallback=shifted,ascii alt+k kitten relative_resize.py up    3
map --allow-fallback=shifted,ascii alt+h kitten relative_resize.py left  3
map --allow-fallback=shifted,ascii alt+l kitten relative_resize.py right 3

map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM alt+j
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM alt+k
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM alt+h
map --allow-fallback=shifted,ascii --when-focus-on var:IS_NVIM alt+l

map --allow-fallback=shifted,ascii kitty_mod+w>c new_window
map --allow-fallback=shifted,ascii kitty_mod+w>q close_window
map --allow-fallback=shifted,ascii kitty_mod+w>n next_window
map --allow-fallback=shifted,ascii kitty_mod+w>p previous_window
map --allow-fallback=shifted,ascii kitty_mod+w>l move_window_forward
map --allow-fallback=shifted,ascii kitty_mod+w>h move_window_backward
map --allow-fallback=shifted,ascii kitty_mod+w>t move_window_to_top
map --allow-fallback=shifted,ascii kitty_mod+w>r start_resizing_window

map kitty_mod+f7 focus_visible_window
map kitty_mod+f8 swap_with_window

map --allow-fallback=shifted,ascii kitty_mod+t>n next_tab
map --allow-fallback=shifted,ascii kitty_mod+t>p previous_tab
map --allow-fallback=shifted,ascii kitty_mod+t>c new_tab
map --allow-fallback=shifted,ascii kitty_mod+t>q close_tab
map --allow-fallback=shifted,ascii kitty_mod+t>l move_tab_forward
map --allow-fallback=shifted,ascii kitty_mod+t>h move_tab_backward
map --allow-fallback=shifted,ascii kitty_mod+. set_tab_title

map kitty_mod+1  goto_tab 1
map kitty_mod+2  goto_tab 2
map kitty_mod+3  goto_tab 3
map kitty_mod+4  goto_tab 4
map kitty_mod+5  goto_tab 5
map kitty_mod+6  goto_tab 6
map kitty_mod+7  goto_tab 7
map kitty_mod+8  goto_tab 8
map kitty_mod+9  goto_tab 9
map kitty_mod+10 goto_tab 10

map --allow-fallback=shifted,ascii kitty_mod+w>l next_layout

map kitty_mod+equal  change_font_size all +2.0
map kitty_mod+plus   change_font_size all +2.0
map kitty_mod+kp_add change_font_size all +2.0
map kitty_mod+minus       change_font_size all -2.0
map kitty_mod+kp_subtract change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

map --allow-fallback=shifted,ascii kitty_mod+p>u open_url_with_hints
map --allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -
map --allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path
map --allow-fallback=shifted,ascii kitty_mod+p>p kitten choose-files
map --allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir
map --allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -
map --allow-fallback=shifted,ascii kitty_mod+p>w kitten hints --type word --program -
map --allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -
map --allow-fallback=shifted,ascii kitty_mod+p>n kitten hints --type linenum
map --allow-fallback=shifted,ascii kitty_mod+p>x kitten hints --type hyperlink
map --allow-fallback=shifted,ascii kitty_mod+p>/ command_palette

map kitty_mod+f1 show_kitty_doc overview
map kitty_mod+f11 toggle_fullscreen
map kitty_mod+f10 toggle_maximized

map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input

map kitty_mod+; kitty_shell window

map --allow-fallback=shifted,ascii kitty_mod+l>a clear_terminal reset active
map --allow-fallback=shifted,ascii kitty_mod+l>c clear_terminal to_cursor active
map --allow-fallback=shifted,ascii kitty_mod+l>s clear_terminal scrollback active
map --allow-fallback=shifted,ascii kitty_mod+l>o clear_terminal last_command active
map --allow-fallback=shifted,ascii kitty_mod+l>l clear_terminal to_cursor_scroll active
map --allow-fallback=shifted,ascii ctrl+l clear_terminal to_cursor_scroll active

map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config
map kitty_mod+q quit

